version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

name: aibomgen-cli Go Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true
          cache-dependency-path: |
            **/go.sum
            **/go.work.sum

      - name: Show Go env
        run: |
          go version
          go env GOMODCACHE GOCACHE GOOS GOARCH

      - name: Install dependencies
        run: go mod tidy

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Run tests (with coverage)
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        shell: bash
        env:
          COVERAGE_THRESHOLD: 50
        run: |
          if [ ! -f coverage.out ]; then
            echo "No coverage report found"; exit 1
          fi
          percent=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | sed 's/%//')
          echo "Coverage: $percent%"
          int=${percent%.*}
          if [ "$int" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "Coverage $percent% is below required ${COVERAGE_THRESHOLD}%"; exit 1
          fi

      - name: Build
        run: |
          go build -o aibomgen-cli ./
          chmod +x aibomgen-cli
          
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          file: ./aibomgen-cli
          format: cyclonedx-json
          output-file: sbom-binary.json
          upload-artifact: false

      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@v7
        with:
          sbom: sbom-binary.json
          output-format: cyclonedx-json
          output-file: sbom-binary-vulnerabilities.json
          fail-build: false

      - name: Scan SBOM for vulnerabilities (Grype) — table output
        uses: anchore/scan-action@v7
        with:
          sbom: sbom-binary.json
          output-format: table
          output-file: grype.table
          fail-build: false

      - name: Vulnerability summary (grype)
        run: |
          set -eo pipefail
          if [ -f grype.table ] && [ -s grype.table ]; then
            head -n 50 grype.table >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results from grype" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload vulnerability reports
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-reports
          path: |
            sbom-binary-vulnerabilities.json
            grype.table
            sbom-binary.json
          retention-days: 30

      - name: Fail if vulnerabilities found
        run: |
          if [ ! -f sbom-binary-vulnerabilities.json ]; then
            echo "vulnerabilities file not found"; exit 1
          fi
          count=$(jq '.vulnerabilities | length' sbom-binary-vulnerabilities.json || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "Found $count vulnerabilities in SBOM"; exit 1
          fi

  # Stable required status check: matrix jobs report as "build (<go-version>)",
  # which changes on every Go bump. Branch rules require this "build" gate instead.
  build-status:
    name: build
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check build matrix result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build matrix result: ${{ needs.build.result }}"; exit 1
          fi

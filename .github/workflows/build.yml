name: aibomgen-cli Go Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        env:
          COVERAGE_THRESHOLD: 50
        run: |
          percent=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Coverage: ${percent}%" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${percent%.*}" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "Coverage ${percent}% is below required ${COVERAGE_THRESHOLD}%"; exit 1
          fi

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        run: go build -o aibomgen-cli .

      # Offline end-to-end smoke test (dummy HF mode, no network).
      - name: Smoke test (scan → validate → completeness)
        run: |
          ./aibomgen-cli scan --hf-mode dummy -o dist/ -q
          for f in dist/*; do
            ./aibomgen-cli validate "$f" --strict --min-score 0.1 -q
            ./aibomgen-cli completeness "$f" --json \
              | jq -r '"Model: \(.modelId) | Score: \(.score * 100 | floor)% | Fields: \(.passed)/\(.total)"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  # Stable required status check name. Branch rules require this "build" gate.
  build-status:
    name: build
    if: ${{ always() }}
    needs: [test, zizmor]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job finished with: $r"; exit 1
            fi
          done

# aibomgen-cli example configuration
# Reference of every configurable key with its default. Copy it to
# $HOME/.aibomgen-cli.yaml (or pass --config <file>) and edit as needed.
# When run from the repo root without --config, this file is loaded as-is.

# ============================================================================
# Command: generate
# ============================================================================
generate:
  # Hugging Face model ID(s) to generate AIBOMs for (list)
  model-ids: []
  # Interactive model selector (cannot be used with model-ids)
  interactive: false
  # Output directory; one <model-ref>.aibom.cdx.<json|xml> file is written per model
  output: "./dist"
  # Output BOM format: json|xml
  format: "json"
  # CycloneDX spec version for output (e.g., 1.5, 1.6, 1.7) empty is latest (1.7)
  spec: ""
  # Hugging Face metadata mode: online|dummy
  hf-mode: "online"
  # Timeout in seconds per Hugging Face API request
  hf-timeout: 10
  # Hugging Face access token
  hf-token: ""
  # Log level: quiet|standard|debug
  log-level: "standard"
  # Skip fetching the HuggingFace security scan tree
  no-security-scan: false

# ============================================================================
# Command: scan
# ============================================================================
scan:
  # Path to scan (defaults to current directory)
  input: ""
  # Output directory; one <model-ref>.aibom.cdx.<json|xml> file is written per model
  output: "./dist"
  # Output BOM format: json|xml
  format: "json"
  # CycloneDX spec version for output (e.g., 1.5, 1.6, 1.7) empty is latest (1.7)
  spec: ""
  # Hugging Face metadata mode: online|dummy
  hf-mode: "online"
  # Timeout in seconds per Hugging Face API request
  hf-timeout: 10
  # Hugging Face access token
  hf-token: ""
  # Log level: quiet|standard|debug
  log-level: "standard"
  # Skip fetching the HuggingFace security scan tree
  no-security-scan: false

# ============================================================================
# Command: enrich
# ============================================================================
enrich:
  # Path to existing AIBOM (required)
  input: ""
  # Output file path (default: overwrite input); .xml writes XML, anything else JSON
  output: ""
  # CycloneDX spec version for output (default: same as input)
  spec: ""
  # Enrichment strategy: interactive|file
  strategy: "interactive"
  # Path to enrichment config file (YAML)
  file: "./config/enrichment.yaml"
  # Only prompt for required fields
  required-only: false
  # Only prompt for fields with weight >= this value
  min-weight: 0.0
  # Refetch model metadata from Hugging Face before enrichment
  refetch: true
  # Skip preview before saving
  no-preview: false
  # Log level: quiet|standard|debug
  log-level: "standard"
  # Hugging Face API token (for refetch)
  hf-token: ""
  # Hugging Face base URL (for refetch)
  hf-base-url: "https://huggingface.co"
  # Hugging Face API timeout in seconds (for refetch)
  hf-timeout: 10

# ============================================================================
# Command: validate
# ============================================================================
validate:
  # Path to AIBOM file (required)
  input: ""
  # Strict mode: fail on missing required fields and on vulnerabilities >= fail-severity
  strict: false
  # Lowest vulnerability severity that fails strict mode: critical|high|medium|low|info
  fail-severity: "medium"
  # Minimum completeness score (0.0-1.0), enforced with or without strict
  min-score: 0.0
  # Log level: quiet|standard|debug (debug also lists missing optional fields)
  log-level: "standard"

# ============================================================================
# Command: completeness
# ============================================================================
completeness:
  # Path to existing AIBOM file (required)
  input: ""
  # Log level: quiet|standard|debug
  log-level: "standard"
  # Print a single-line plain summary (no styling)
  plain-summary: false

# ============================================================================
# Command: merge
# ============================================================================
merge:
  # Path(s) to AIBOM file(s) (list, required)
  aiboms: []
  # Path to SBOM file (required)
  sbom: ""
  # Output path for merged BOM (required); .xml writes XML, anything else JSON
  output: ""
  # Remove duplicate components based on BOM-ref
  deduplicate: true
  # Log level: quiet|standard|debug
  log-level: "standard"

# ============================================================================
# Command: vuln-scan
# ============================================================================
vuln-scan:
  # Path to existing AIBOM (required)
  input: ""
  # Output path when enrich is true (default: overwrite input); .xml writes XML, anything else JSON
  output: ""
  # CycloneDX spec version for output (e.g., 1.5, 1.6, 1.7) empty is latest (1.7)
  spec: ""
  # Inject discovered vulnerabilities back into the AIBOM
  enrich: false
  # Show confirmation prompt before saving (only with enrich)
  interactive: true
  # Skip preview prompt (only with enrich)
  no-preview: false
  # Hugging Face access token
  hf-token: ""
  # Hugging Face base URL
  hf-base-url: "https://huggingface.co"
  # Timeout in seconds per Hugging Face API request
  hf-timeout: 15
  # Log level: quiet|standard|debug
  log-level: "standard"

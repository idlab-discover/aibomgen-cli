version: 2

builds:
  - main: .
    binary: aibomgen-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - "-s -w -X main.Version={{ .Version }}"
    flags:
      - "-trimpath"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# CycloneDX SBOM per archive, generated by syft from what is actually shipped.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Keyless cosign signature over checksums.txt (covers every archive and SBOM).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^ci:'
      - 'skip ci'